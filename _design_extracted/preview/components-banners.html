<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Banners</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); display: flex; flex-direction: column; gap: 12px; }
  .amber { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 14px; text-align: center; }
  .amber p { margin: 0; }
  .amber .t { color: #92400e; font-weight: 500; font-size: 14px; }
  .amber .s { color: #d97706; font-size: 13px; margin-top: 4px !important; }
  .green { background: #f0fdf4; color: #15803d; border-radius: 8px; padding: 12px 16px; font-size: 14px; }
  .error { color: #ef4444; font-size: 13px; }
</style></head>
<body>
  <div class="amber">
    <p class="t">✅ Анкета уже заполнена</p>
    <p class="s">Редактирование недоступно. Ниже — ваши ответы.</p>
  </div>
  <div class="green">Пароль успешно изменён</div>
  <div class="error">Неверный email или пароль</div>
</body></html>
