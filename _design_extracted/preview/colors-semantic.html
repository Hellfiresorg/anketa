<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Colors · Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .cell { border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 98px; }
  .cell .chip { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 9999px; }
  .cell .name { font-size: 12px; font-weight: 600; color: #374151; }
  .cell .val { font: 500 10px/1 ui-monospace, Menlo, monospace; color: #6b7280; }
  .lbl { font: 600 13px/1.4 var(--font-sans); color: var(--fg-strong); margin: 0 0 10px; }
</style></head>
<body>
  <div class="lbl">Semantic status — только как бейджи рядом с текстом</div>
  <div class="grid">
    <div class="cell" style="background:#f9fafb">
      <span class="chip" style="background:#fef3c7;color:#92400e">Ожидает</span>
      <span class="name">pending</span>
      <span class="val">yellow-100 / yellow-800</span>
    </div>
    <div class="cell" style="background:#f9fafb">
      <span class="chip" style="background:#dbeafe;color:#1e40af">Заполняется</span>
      <span class="name">in_progress</span>
      <span class="val">blue-100 / blue-800</span>
    </div>
    <div class="cell" style="background:#f9fafb">
      <span class="chip" style="background:#dcfce7;color:#166534">Заполнено</span>
      <span class="name">completed · done</span>
      <span class="val">green-100 / green-800</span>
    </div>
    <div class="cell" style="background:#f9fafb">
      <span class="chip" style="background:#fee2e2;color:#991b1b">Ошибка</span>
      <span class="name">failed</span>
      <span class="val">red-100 / red-800</span>
    </div>
  </div>
</body></html>
