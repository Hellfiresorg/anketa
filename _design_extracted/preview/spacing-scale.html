<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 14px; padding: 4px 0; }
  .label { width: 56px; font: 500 11px/1 ui-monospace, Menlo, monospace; color: #6b7280; }
  .bar { height: 14px; background: #102f6e; border-radius: 3px; }
  .val { font-size: 11px; color: #9ca3af; }
</style></head>
<body>
  <div class="row"><span class="label">1</span><div class="bar" style="width:4px"></div><span class="val">4px · padding fine-tune</span></div>
  <div class="row"><span class="label">2</span><div class="bar" style="width:8px"></div><span class="val">8px · button inner pad</span></div>
  <div class="row"><span class="label">3</span><div class="bar" style="width:12px"></div><span class="val">12px · input padding-x</span></div>
  <div class="row"><span class="label">4</span><div class="bar" style="width:16px"></div><span class="val">16px · card padding</span></div>
  <div class="row"><span class="label">5</span><div class="bar" style="width:20px"></div><span class="val">20px · card interior</span></div>
  <div class="row"><span class="label">6</span><div class="bar" style="width:24px"></div><span class="val">24px · page gutter, card pad</span></div>
  <div class="row"><span class="label">8</span><div class="bar" style="width:32px"></div><span class="val">32px · page py</span></div>
  <div class="row"><span class="label">12</span><div class="bar" style="width:48px"></div><span class="val">48px · hero vertical rhythm</span></div>
</body></html>
