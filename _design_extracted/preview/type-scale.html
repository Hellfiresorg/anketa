<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); color: #111827; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; vertical-align: baseline; }
  td.meta { width: 140px; color: #6b7280; font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
</style></head>
<body>
  <table>
    <tr><td class="meta">3xl · 30/36 · 700</td><td style="font-size:30px;line-height:36px;font-weight:700;color:#102f6e">Голосовые анкеты</td></tr>
    <tr><td class="meta">2xl · 24/32 · 700</td><td style="font-size:24px;line-height:32px;font-weight:700;color:#102f6e">Проверьте ответы</td></tr>
    <tr><td class="meta">xl · 20/28 · 600</td><td style="font-size:20px;line-height:28px;font-weight:600">Иван Иванов</td></tr>
    <tr><td class="meta">lg · 18/28 · 600</td><td style="font-size:18px;line-height:28px;font-weight:600;color:#102f6e">Анкеты</td></tr>
    <tr><td class="meta">base · 16/24 · 400</td><td style="font-size:16px;line-height:24px">Расскажите, как вы узнали о нас.</td></tr>
    <tr><td class="meta">sm · 14/20 · 500</td><td style="font-size:14px;line-height:20px;font-weight:500;color:#374151">Email</td></tr>
    <tr><td class="meta">xs · 12/16 · 500</td><td style="font-size:12px;line-height:16px;font-weight:500;color:#9ca3af">18 апреля 2026</td></tr>
  </table>
</body></html>
