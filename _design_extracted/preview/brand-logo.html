<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); display: flex; align-items: center; gap: 28px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .label { font-size: 11px; color: #9ca3af; font-family: ui-monospace, Menlo, monospace; }
  .big { width: 96px; height: 96px; border-radius: 12px; background: #102f6e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; letter-spacing: 0.05em; }
  .med { width: 48px; height: 48px; border-radius: 8px; background: #102f6e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .sm { width: 32px; height: 32px; border-radius: 6px; background: #102f6e; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
  .wm { display: flex; align-items: center; gap: 10px; }
  .wm-mark { width: 32px; height: 32px; border-radius: 6px; background: #102f6e; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .wm-text { color: #102f6e; font-size: 20px; font-weight: 700; }
</style></head>
<body>
  <div class="col"><div class="big">LOGO</div><div class="label">logo.svg · 512px</div></div>
  <div class="col"><div class="med">А</div><div class="label">mark · 48px</div></div>
  <div class="col"><div class="sm">А</div><div class="label">favicon · 32px</div></div>
  <div class="col"><div class="wm"><div class="wm-mark">А</div><div class="wm-text">Анкеты</div></div><div class="label">wordmark · nav</div></div>
</body></html>
