<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 80px; height: 64px; background: #e8eef8; border: 1.5px solid #102f6e; }
  .n { font: 600 12px/1 var(--font-sans); color: #374151; }
  .v { font: 500 10px/1 ui-monospace, Menlo, monospace; color: #9ca3af; }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="shape" style="border-radius:6px"></div><div class="n">sm</div><div class="v">6px</div></div>
    <div class="cell"><div class="shape" style="border-radius:8px"></div><div class="n">md · inputs</div><div class="v">8px</div></div>
    <div class="cell"><div class="shape" style="border-radius:12px"></div><div class="n">lg · cards</div><div class="v">12px</div></div>
    <div class="cell"><div class="shape" style="border-radius:16px"></div><div class="n">xl · client btn</div><div class="v">16px</div></div>
    <div class="cell"><div class="shape" style="border-radius:9999px"></div><div class="n">full · badges</div><div class="v">9999px</div></div>
  </div>
</body></html>
