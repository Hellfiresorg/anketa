<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Table row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #f9fafb; font-family: var(--font-sans); }
  .wrap { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead tr { background: #f9fafb; border-bottom: 1px solid #e5e7eb; }
  th { text-align: left; padding: 10px 14px; font-weight: 500; color: #4b5563; font-size: 13px; }
  td { padding: 10px 14px; border-bottom: 1px solid #f3f4f6; color: #374151; }
  tr:last-child td { border-bottom: 0; }
  .name { font-weight: 500; color: #111827; }
  .muted { color: #6b7280; }
  .faint { color: #9ca3af; font-size: 12px; }
  .chip { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 9999px; }
</style></head>
<body>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>Клиент</th><th>Менеджер</th><th>Статус</th><th>Транскрипции</th><th>Создано</th>
      </tr></thead>
      <tbody>
        <tr><td class="name">Ольга Петрова</td><td class="muted">Анна Р.</td><td><span class="chip" style="background:#dcfce7;color:#166534">Заполнено</span></td><td class="muted">10/10</td><td class="faint">14.04.2026</td></tr>
        <tr style="background:#f9fafb"><td class="name">Иван Иванов</td><td class="muted">Анна Р.</td><td><span class="chip" style="background:#dbeafe;color:#1e40af">Заполняется</span></td><td class="muted">6/10</td><td class="faint">16.04.2026</td></tr>
        <tr><td class="name">Дмитрий К.</td><td class="muted">Сергей М.</td><td><span class="chip" style="background:#fef3c7;color:#92400e">Ожидает</span></td><td class="muted">0/10</td><td class="faint">17.04.2026</td></tr>
      </tbody>
    </table>
  </div>
</body></html>
