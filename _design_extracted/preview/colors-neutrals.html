<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Colors · Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .sw { height: 68px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; font: 500 10px/1.2 var(--font-sans); }
  .sw b { display: block; font-weight: 600; font-size: 11px; }
  .sw.lt { color: #111827; }
  .sw.dk { color: #fff; }
  .sw code { font: 500 9px/1 var(--font-mono); opacity: 0.7; }
  .lbl { font: 600 13px/1.4 var(--font-sans); color: var(--fg-strong); margin: 0 0 10px; }
</style></head>
<body>
  <div class="lbl">Neutrals — единая серая шкала, используется повсеместно</div>
  <div class="row">
    <div class="sw lt" style="background:#f9fafb;border:1px solid #e5e7eb"><b>50</b><code>#f9fafb</code></div>
    <div class="sw lt" style="background:#f3f4f6"><b>100</b><code>#f3f4f6</code></div>
    <div class="sw lt" style="background:#e5e7eb"><b>200</b><code>#e5e7eb</code></div>
    <div class="sw lt" style="background:#d1d5db"><b>300</b><code>#d1d5db</code></div>
    <div class="sw lt" style="background:#9ca3af"><b>400</b><code>#9ca3af</code></div>
    <div class="sw dk" style="background:#6b7280"><b>500</b><code>#6b7280</code></div>
    <div class="sw dk" style="background:#4b5563"><b>600</b><code>#4b5563</code></div>
    <div class="sw dk" style="background:#374151"><b>700</b><code>#374151</code></div>
    <div class="sw dk" style="background:#1f2937"><b>800</b><code>#1f2937</code></div>
    <div class="sw dk" style="background:#111827"><b>900</b><code>#111827</code></div>
  </div>
</body></html>
