<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .chip { font-size: 12px; font-weight: 500; padding: 2px 10px; border-radius: 9999px; line-height: 18px; }
  .desc { font-size: 12px; color: #6b7280; }
  .mono { font: 500 11px/1 ui-monospace, Menlo, monospace; color: #9ca3af; margin-left: auto; }
</style></head>
<body>
  <div class="row"><span class="chip" style="background:#fef3c7;color:#92400e">Ожидает</span><span class="desc">приглашение создано, клиент не открывал</span><span class="mono">pending</span></div>
  <div class="row"><span class="chip" style="background:#dbeafe;color:#1e40af">Заполняется</span><span class="desc">клиент открыл ссылку, ещё не отправил</span><span class="mono">in_progress</span></div>
  <div class="row"><span class="chip" style="background:#dcfce7;color:#166534">Заполнено</span><span class="desc">клиент отправил анкету</span><span class="mono">completed</span></div>
  <div class="row"><span class="chip" style="background:#dbeafe;color:#1e40af">Обрабатывается</span><span class="desc">Groq Whisper транскрибирует аудио</span><span class="mono">processing</span></div>
  <div class="row"><span class="chip" style="background:#dcfce7;color:#166534">Готово</span><span class="desc">транскрипция получена</span><span class="mono">done</span></div>
  <div class="row"><span class="chip" style="background:#fee2e2;color:#991b1b">Ошибка</span><span class="desc">5 попыток исчерпаны, нужна ручная повторка</span><span class="mono">failed</span></div>
</body></html>
