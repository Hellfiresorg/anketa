<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Colors · Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .sw { height: 68px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 8px; font: 500 10px/1.2 var(--font-sans); }
  .sw b { display: block; font-weight: 600; font-size: 11px; }
  .sw.lt { color: #0a1f4a; }
  .sw.dk { color: #fff; }
  .sw code { font: 500 9px/1 var(--font-mono); opacity: 0.8; }
  .lbl { font: 600 13px/1.4 var(--font-sans); color: var(--fg-strong); margin: 0 0 10px; }
</style></head>
<body>
  <div class="lbl">Primary — единственный брендовый цвет</div>
  <div class="row">
    <div class="sw lt" style="background:#e8eef8"><b>50</b><code>#e8eef8</code></div>
    <div class="sw lt" style="background:#c5d4ef"><b>100</b><code>#c5d4ef</code></div>
    <div class="sw lt" style="background:#9eb6e4"><b>200</b><code>#9eb6e4</code></div>
    <div class="sw lt" style="background:#7797d9"><b>300</b><code>#7797d9</code></div>
    <div class="sw dk" style="background:#5a81d0"><b>400</b><code>#5a81d0</code></div>
    <div class="sw dk" style="background:#3d6bc7"><b>500</b><code>#3d6bc7</code></div>
    <div class="sw dk" style="background:#2d5ab0"><b>600</b><code>#2d5ab0</code></div>
    <div class="sw dk" style="background:#1e4898"><b>700</b><code>#1e4898</code></div>
    <div class="sw dk" style="background:#102f6e;outline:2px solid #102f6e;outline-offset:2px"><b>800 ★</b><code>#102f6e</code></div>
    <div class="sw dk" style="background:#0a1f4a"><b>900</b><code>#0a1f4a</code></div>
  </div>
</body></html>
