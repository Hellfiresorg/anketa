<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: #fff; font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: 56px 1fr 180px; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
  .row:last-child { border: 0; }
  .w { font: 500 11px/1 ui-monospace, Menlo, monospace; color: #6b7280; }
  .sample { font-size: 20px; color: #111827; }
  .use { font-size: 11px; color: #9ca3af; }
</style></head>
<body>
  <div class="row"><span class="w">400</span><span class="sample" style="font-weight:400">Текст анкеты, плейсхолдеры</span><span class="use">body · placeholders</span></div>
  <div class="row"><span class="w">500</span><span class="sample" style="font-weight:500">Email · Телефон · Клиент</span><span class="use">labels · table headers</span></div>
  <div class="row"><span class="w">600</span><span class="sample" style="font-weight:600">Проверьте ответы</span><span class="use">section titles · questions</span></div>
  <div class="row"><span class="w">700</span><span class="sample" style="font-weight:700;color:#102f6e">Голосовые анкеты</span><span class="use">page H1 · brand</span></div>
</body></html>
