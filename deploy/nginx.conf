# ─────────────────────────────────────────────────────────────────
#  Anketa — nginx reverse proxy config
#  Файл: /etc/nginx/sites-available/anketa
#
#  Замените все вхождения:
#    api.yourdomain.ru  → ваш домен/субдомен для API
#    /var/anketa/audio  → путь к папке с аудио (совпадает с AUDIO_ROOT)
# ─────────────────────────────────────────────────────────────────

# Перенаправление HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — основной виртуальный хост
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourdomain.ru;

    # SSL-сертификаты (выпускаются через certbot — см. инструкцию)
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Размер тела запроса — должен быть >= MAX_AUDIO_SIZE_MB
    client_max_body_size 30M;

    # Таймауты (важно для длинной загрузки аудио)
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # Прокси к FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Прямая отдача аудиофайлов через nginx (быстрее, чем через Python)
    # Раскомментируйте, если хотите отдавать файлы напрямую;
    # при этом удалите маршрут /api/admin/responses/{id}/audio из FastAPI
    # или оставьте его — дублирования не будет, nginx перехватит /audio/*
    #
    # location /audio/ {
    #     alias /var/anketa/audio/;
    #     internal;
    # }

    # Логи
    access_log /var/log/nginx/anketa-api.access.log;
    error_log  /var/log/nginx/anketa-api.error.log;
}
