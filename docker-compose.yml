services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: voice_survey
      POSTGRES_PASSWORD: password
      POSTGRES_DB: voice_survey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_survey"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_survey:password@postgres:5432/voice_survey
      REDIS_URL: redis://redis:6379/0
      AUDIO_ROOT: /var/voice-survey/audio
    volumes:
      - ./backend:/app
      - audio_data:/var/voice-survey/audio
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m arq app.workers.arq_worker.WorkerSettings
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_survey:password@postgres:5432/voice_survey
      REDIS_URL: redis://redis:6379/0
      AUDIO_ROOT: /var/voice-survey/audio
    volumes:
      - ./backend:/app
      - audio_data:/var/voice-survey/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-client:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend-client:/app
    ports:
      - "5173:5173"

  frontend-admin:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend-admin:/app
    ports:
      - "5174:5174"

volumes:
  postgres_data:
  audio_data:
