name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend-admin/package-lock.json
            frontend-client/package-lock.json

      - name: Build frontend-admin
        run: |
          cd frontend-admin
          npm ci
          npm run build

      - name: Build frontend-client
        run: |
          cd frontend-client
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend-admin
        run: |
          rsync -az --delete \
            frontend-admin/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/services/anketa/frontend-admin/

      - name: Deploy frontend-client
        run: |
          rsync -az --delete \
            frontend-client/dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/services/anketa/frontend-client/

      - name: Deploy backend
        run: |
          rsync -az \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.db' \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/services/anketa/backend/

      - name: Rebuild and restart
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            cd /opt/services/anketa &&
            docker compose build api worker &&
            docker compose up -d &&
            echo 'Waiting for API...' &&
            sleep 5 &&
            docker exec anketa-api python scripts/seed.py
          "
