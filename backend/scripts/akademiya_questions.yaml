template_name: "Анкета Академии Будущего"
questions:
  - order_index: 1
    text: "Опишите момент, когда вы поняли, что ситуация с ребёнком вышла за рамки того, с чем вы можете справиться сами. Что конкретно стало отправной точкой для поиска решения?"
    is_required: true

  - order_index: 2
    text: "Что вы пробовали до Академии: психологи, другие центры, что-то ещё? Почему это не дало результата?"
    is_required: true

  - order_index: 3
    text: "Когда вы искали решение, какие слова или фразы вводили в поиске? Попробуйте вспомнить, на какие ресурсы, форумы или телеграм канал заходили?"
    is_required: true

  - order_index: 4
    text: "Какие конкретные опасения были у вас насчёт Академии до поступления? Что вас пугало или настораживало?"
    is_required: true

  - order_index: 5
    text: "Что именно вас убедило выбрать Академию Будущего, а не что-то другое? Был ли какой-то конкретный момент, фраза, материал, после которого вы решили: «это то, что нужно нашей семье»?"
    is_required: true

  - order_index: 6
    text: "Как вы объясняли ребёнку, куда он едет и зачем? Как он отреагировал?"
    is_required: true

  - order_index: 7
    text: "Говорили ли вы с кем-то из близких о своём решении отдать ребёнка в Академию? Как они отреагировали, и как это на вас повлияло?"
    is_required: false

  - order_index: 8
    text: "Если бы вам нужно было объяснить другому родителю в похожей ситуации, что такое Академия Будущего, одним-двумя предложениями — как бы вы это сформулировали?"
    is_required: true

  - order_index: 9
    text: "Что должно произойти за время пребывания ребёнка в Академии, чтобы вы сказали: «да, это того стоило»? По каким признакам вы это поймёте?"
    is_required: true

  - order_index: 10
    text: "Какие эмоции вы испытываете после поступления вашего ребенка в Академию?"
    is_required: true
